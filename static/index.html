<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deal Room Assistant</title>
  <script>
    // A dead page must say why. Shows the problem if a file fails to load or the app does not start.
    (function () {
      var problems = [];
      window.addEventListener("error", function (e) {
        var file = e.target && (e.target.src || e.target.href);
        problems.push(file ? "Could not load " + file : e.message);
      }, true);
      window.addEventListener("load", function () {
        if (window.appStarted && !problems.length) return;
        var box = document.createElement("div");
        box.setAttribute("role", "alert");
        box.id = "startup-error";
        box.style.cssText = "position:fixed;left:16px;right:16px;bottom:16px;z-index:99;padding:12px 14px;" +
          "border-radius:8px;background:#b42318;color:#fff;font:14px/1.4 sans-serif;";
        box.textContent = "This page did not start correctly. " + (problems.join(" ") || "The app script did not run.");
        document.body.appendChild(box);
      });
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand" id="brand">Deal Room Assistant</div>
      <nav class="nav">
        <button type="button" id="nav-library" class="nav-item">Library</button>
        <button type="button" id="nav-issues" class="nav-item">Issues <span id="issues-badge" class="count" hidden></span></button>
      </nav>
      <label class="company-picker">Company:
        <select id="company-select"><option value="">Auto-detect</option></select>
      </label>
      <button type="button" id="brief-button" class="brief-button">Generate Brief</button>
    </header>

    <div class="workspace">
    <section id="drawer" class="drawer" aria-labelledby="drawer-title" hidden>
      <div class="drawer-head">
        <h1 id="drawer-title"></h1>
        <button type="button" id="drawer-close" class="secondary">Close</button>
      </div>
      <div id="drawer-body" class="drawer-body"></div>
    </section>

    <main class="main">
      <div id="chat" class="chat" aria-live="polite"></div>

      <div class="composer">
        <div class="mode-switch" role="group" aria-label="Choose what to do">
          <button type="button" id="mode-upload" class="mode">Upload</button>
          <button type="button" id="mode-ask" class="mode">Ask</button>
        </div>

        <form id="ask-pane" class="pane">
          <div class="ask-row">
            <textarea id="question" rows="2" placeholder="Ask about a company by name, or follow up on the last answer…"></textarea>
            <button type="submit" id="ask-button">Ask</button>
          </div>
        </form>

        <div id="upload-pane" class="pane" hidden>
          <label id="dropzone" class="dropzone">
            <input id="upload-file" type="file" accept=".pdf,.txt,.md,.csv">
            <span id="dropzone-text" class="dropzone-text"><b>Choose a file</b> or drop it here</span>
            <span class="muted small">PDF, TXT or MD, or CRM records as CSV. You confirm the details before it is stored.</span>
          </label>
        </div>
      </div>
    </main>
    </div>
  </div>

  <!-- Upload confirmation -->
  <dialog id="upload-dialog" class="dialog" aria-labelledby="upload-title">
    <form id="upload-form" class="stack">
      <div>
        <h2 id="upload-title" class="dialog-title">Confirm upload</h2>
        <div id="upload-filename" class="muted small filename"></div>
      </div>
      <div id="upload-warnings"></div>
      <label>Company
        <select id="upload-company"></select>
        <input id="upload-new-company" type="text" placeholder="New company name" autocomplete="off" hidden>
        <span id="upload-company-why" class="hint"></span>
      </label>
      <label>Material type
        <select id="upload-type">
          <option value="deck">Pitch deck</option>
          <option value="notes">Meeting notes</option>
          <option value="crm">CRM records</option>
        </select>
        <span id="upload-type-why" class="hint"></span>
      </label>
      <label>Material date
        <input id="upload-date" type="date">
        <span id="upload-date-why" class="hint"></span>
      </label>
      <div class="dialog-actions">
        <button type="button" id="upload-cancel" class="secondary">Cancel</button>
        <button type="submit" id="upload-confirm">Add</button>
      </div>
    </form>
  </dialog>

  <!-- Brief requirements -->
  <dialog id="brief-dialog" class="dialog" aria-labelledby="brief-dialog-title">
    <form id="brief-form" class="stack">
      <h2 id="brief-dialog-title" class="dialog-title">Generate brief</h2>
      <div id="brief-company"></div>
      <label id="brief-requirements-label">Requirements
        <input id="brief-requirements" type="text" placeholder="e.g. focus on traction and risks" autocomplete="off">
      </label>
      <div class="dialog-actions">
        <button type="button" id="brief-cancel" class="secondary">Cancel</button>
        <button type="submit" id="brief-generate">Generate</button>
      </div>
    </form>
  </dialog>

  <!-- Delete confirmation: built into the page because some browsers block native confirm() -->
  <dialog id="delete-dialog" class="dialog" aria-labelledby="delete-title">
    <div class="stack">
      <h2 id="delete-title" class="dialog-title">Delete file?</h2>
      <div id="delete-message"></div>
      <div class="dialog-actions">
        <button type="button" id="delete-cancel" class="secondary">Cancel</button>
        <button type="button" id="delete-confirm" class="danger-button">Delete</button>
      </div>
    </div>
  </dialog>

  <!-- Brief result -->
  <div id="brief-overlay" class="overlay" hidden>
    <div class="overlay-card" role="dialog" aria-modal="true" aria-labelledby="brief-title">
      <div class="overlay-head">
        <h2 id="brief-title">Company brief</h2>
        <div class="overlay-actions">
          <button type="button" id="brief-copy" class="secondary">Copy Markdown</button>
          <button type="button" id="brief-download" class="secondary">Download .md</button>
          <button type="button" id="brief-close" aria-label="Close">Close</button>
        </div>
      </div>
      <div id="brief-body" class="brief-body"></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
